[project]
name = "llm-internal"
version = "0.1.0"
description = "Homemade LLM: QLoRA tool-use fine-tune of Qwen3-1.7B"
requires-python = ">=3.10"
dependencies = [
    # Pinned <2.6: unpinned torch resolves to the latest release, whose
    # default PyPI wheel targets CUDA 13 and drops kernels for older
    # compute-capability GPUs (e.g. Turing/T4, cc 7.5) -- fails at
    # runtime with "no kernel image is available for execution on the
    # device". 2.5.x's default wheel bundles CUDA 12.4, which supports
    # Turing through Hopper and matches unsloth's tested torch250 combo.
    "torch>=2.5.1,<2.6",
    "transformers>=4.51.0",
    "trl>=0.9.6",
    "peft>=0.11.1",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "unsloth>=2024.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mlx = ["mlx-lm>=0.31.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_internal"]
