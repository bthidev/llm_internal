[project]
name = "llm-internal"
version = "0.1.0"
description = "Homemade LLM: QLoRA tool-use fine-tune of Qwen3-1.7B"
requires-python = ">=3.10"
dependencies = [
    # Pinned to the 2.6.x line: unpinned torch resolves to the latest
    # release, whose default PyPI wheel targets CUDA 13 and drops
    # kernels for older compute-capability GPUs (e.g. Turing/T4, cc
    # 7.5) -- fails at runtime with "no kernel image is available for
    # execution on the device". torch<2.6 also breaks: unsloth's
    # transitive torchao dependency references torch.int1, which was
    # only added in torch 2.6.0. 2.6.x's default wheel bundles CUDA
    # 12.4-12.6, which supports Turing through Hopper.
    "torch>=2.6,<2.7",
    "transformers>=4.51.0",
    "trl>=0.9.6",
    "peft>=0.11.1",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "unsloth>=2024.8",
    # Pinned: unsloth-zoo's torchao>=0.13.0 floor lets uv resolve the
    # latest torchao (0.18.0 as of writing), which references torch
    # APIs (torch.utils._pytree.register_constant) newer than torch
    # 2.6.x -- crashes merely importing transformers/unsloth. But
    # peft's LoRA adapter loader (peft.import_utils.is_torchao_available)
    # hard-requires torchao>=0.16.0, raising ImportError instead of
    # treating it as unavailable if a lower version is installed --
    # confirmed at eval time on a live Kaggle run, after a full
    # training run succeeded. Exact-pinned to 0.16.0: it's the only
    # release verified compatible with torch 2.6.x end to end --
    # 0.17.0 additionally breaks (ModuleNotFoundError:
    # BloomPreTrainedModel, via a transformers lazy-import chain) and
    # 0.18.0+ breaks via torch.utils._pytree.register_constant.
    "torchao==0.16.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyright>=1.1"]
mlx = ["mlx-lm>=0.31.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_internal"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Default rule set (E/F) plus import sorting (I) and bugbear (B); this is
# a fine-tuning research repo, not a library -- deliberately not opting
# into stricter/pedantic rule families (docstrings, annotations, etc.).
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by the formatter/line-length setting, not worth a hard lint failure
]

[tool.ruff.lint.isort]
known-first-party = ["llm_internal"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    # Pre-existing typing debt unrelated to this change: trl's public API
    # doesn't re-export SFTConfig/SFTTrainer per its type stubs (works
    # fine at runtime -- see README), and TrainConfig's test fixtures use
    # an untyped dict-merge pattern pyright can't narrow. GPU-only code,
    # not covered by the unit test suite either; left alone per "avoid
    # broad refactors unrelated to this task".
    "src/llm_internal/train",
    "tests/train",
]
pythonVersion = "3.10"
# "basic" (not "strict"): third-party ML libraries (transformers, unsloth,
# trl, peft, mlx_lm) ship partial/no type stubs, so strict mode would flag
# hundreds of reportUnknownMemberType/reportMissingTypeStubs findings on
# code that is otherwise correct. Basic mode still catches real errors
# (undefined names, wrong argument types/counts, unreachable code).
typeCheckingMode = "basic"
reportMissingImports = "warning"  # the mlx extra (mlx_lm) is optional and not always installed

[tool.pytest.ini_options]
addopts = "--cov=llm_internal --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["llm_internal"]
omit = [
    # GPU/Metal-only code paths (model load/generate/train/export); not
    # exercised by the unit test suite, see README "Local development".
    "*/train/sft.py",
    "*/train/mlx_backend.py",
    "*/export/to_gguf.py",
    "*/export/to_mlx.py",
    "*/eval/generation.py",
]
