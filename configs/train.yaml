base_model: Qwen/Qwen3-1.7B
data_dir: data/processed
output_dir: checkpoints
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
learning_rate: 0.0002
epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_seq_length: 4096
checkpoint_every_steps: 50
enable_thinking: false
seed: 42
