# Pinned to an immutable Hugging Face commit sha rather than a mutable ref
# (branch/tag) so `uv run` reproduces the exact same base weights every
# time. To pick up a newer Qwen3-1.7B release: check
# https://huggingface.co/Qwen/Qwen3-1.7B/commits/main for the new commit
# sha, update `base_model_revision` here, and re-verify eval/gates.py's
# benchmark_eval_base.yaml counterpart is updated to match (see README
# "Reproducibility").
base_model: Qwen/Qwen3-1.7B
base_model_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
data_dir: data/processed
output_dir: checkpoints
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
learning_rate: 0.0002
epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_seq_length: 4096
checkpoint_every_steps: 50
enable_thinking: false
backend: cuda
mlx_num_layers: -1
seed: 42
